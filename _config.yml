# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# Change the following value to '/PROJECT_NAME' ONLY IF your site type is GitHub Pages Project sites
# and doesn't have a custom domain.
baseurl: ""

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
# If it has the same name as one of the files in folder `_data/locales`, the layout language will also be changed,
# otherwise, the layout language will use the default value of 'en'.
lang: en

# Change to your timezone › http://www.timezoneconverter.com/cgi-bin/findzone/findzone
timezone: Asia/Riyadh

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: Ahmed Alkaf # the main title

# it will display as the sub-title
tagline: "Full-Stack Software Engineer"
description: >- # used by seo meta and the atom feed
  Portfolio and projects of Ahmed Alkaf — full-stack software engineer.

# fill in the protocol & hostname for your site, e.g., 'https://username.github.io'
url: "https://ahmed.kaflabs.com"

github:
  username: Ahmad-Alkaf # change to your github username

twitter:
  username: Ahmad_Alkaf_ # change to your twitter username

social:
  # Change to your full name.
  # It will be displayed as the default author of the posts and the copyright owner in the Footer
  name: Ahmed Alkaf
  email: ahmad.h.alkaf@gmail.com # change to your email address
  links:
    # The first element serves as the copyright owner's link
    - https://x.com/Ahmad_Alkaf_ # change to your twitter homepage
    - https://github.com/Ahmad-Alkaf # change to your github homepage
    - https://www.linkedin.com/in/Ahmad-Alkaf
    # Uncomment below to add more social links
    # - https://www.facebook.com/username

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Webmaster verification codes (Chirpy v7 replaces the old `google_site_verification`)
webmaster_verifications:
  google: # fill in your Google Search Console verification code
  bing: # fill in your Bing verification code
  alexa: # fill in your Alexa verification code
  yandex: # fill in your Yandex verification code
  baidu: # fill in your Baidu verification code
  facebook: # fill in your Facebook verification code

# Web Analytics Settings (Chirpy v7 consolidates all providers under `analytics`).
# Only ONE id needs to be filled. GoatCounter is recommended: free, privacy-first,
# no cookies, no consent banner. Builds must run with JEKYLL_ENV=production (CI already does).
analytics:
  google:
    id: # fill in your Google Analytics 4 measurement ID (G-XXXXXXXXXX)
  goatcounter:
    id: # fill in your GoatCounter code (the subdomain, e.g. 'ahmadalkaf' for ahmadalkaf.goatcounter.com)
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Prefer color scheme setting.
#
# Note: Keep empty will follow the system prefer color by default,
# and there will be a toggle to switch the theme between dark and light
# on the bottom left of the sidebar.
#
# Available options:
#
#     light  - Use the light color scheme
#     dark   - Use the dark color scheme
#
theme_mode: # [light|dark]

# The CDN endpoint for images.
# Notice that once it is assigned, the CDN url
# will be added to all image (site avatar & posts' images) paths starting with '/'
#
# e.g. 'https://cdn.com'
img_cdn:

# the avatar on sidebar, support local or CORS resources
avatar: "assets/img/avatar.jpg"

# boolean type, the global switch for TOC in posts.
toc: false

comments:
  # Global switch for the post-comment system (Chirpy v7 renamed `active` → `provider`).
  # Keeping it empty means disabled. Recommended: 'giscus' (free, backed by GitHub Discussions).
  provider: # [disqus | utterances | giscus]
  # The provider options are as follows:
  disqus:
    shortname: # fill with the Disqus shortname. › https://help.disqus.com/en/articles/1717111-what-s-a-shortname
  # utterances settings › https://utteranc.es/
  utterances:
    repo: # <gh-username>/<repo>
    issue_term: # < url | pathname | title | ...>
  # Giscus options › https://giscus.app
  giscus:
    repo: # <gh-username>/<repo>  e.g. Ahmad-Alkaf/Ahmad-Alkaf.github.io
    repo_id:
    category:
    category_id:
    mapping: # optional, default to 'pathname'
    strict: # optional, default to '0'
    input_position: # optional, default to 'bottom'
    lang: # optional, default to the value of `site.lang`
    reactions_enabled: # optional, default to the value of `1`

# Self-hosted static assets, optional › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: # boolean, keep empty means false
    # specify the Jekyll environment, empty means both
    # only works if `assets.self_host.enabled` is 'true'
    env: # [development|production]

pwa:
  enabled: true # the option for PWA feature

paginate: 10

plugins:
  - jekyll-target-blank



# ------------ The following options are not recommended to be modified ------------------

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: false # Display TOC column in posts.
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: assets/img/favicons
    values:
      swcache: true
  - scope:
      path: assets/js/dist
    values:
      swcache: true

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - tools
  - README.md
  - CHANGELOG.md
  - LICENSE
  - rollup.config.js
  - node_modules
  - package*.json

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
