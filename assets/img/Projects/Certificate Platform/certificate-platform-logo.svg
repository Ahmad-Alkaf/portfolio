    <circle cx="340" cy="315" r="122" fill="#101A3C"/>
    <circle cx="340" cy="315" r="122" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="340" cy="315" r="102" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-dasharray="3 7"/>
    <!-- check mark -->
