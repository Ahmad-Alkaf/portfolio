<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="28%" cy="38%" r="95%">
      <stop offset="0%" stop-color="#1B2A57"/>
      <stop offset="55%" stop-color="#131D40"/>
      <stop offset="100%" stop-color="#0C1430"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6D578"/>
      <stop offset="48%" stop-color="#E2B349"/>
      <stop offset="100%" stop-color="#BC8B2C"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4CF6E"/>
      <stop offset="100%" stop-color="#D2A23C"/>
